<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Create Account — SOCCKA AI</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.bg-field {
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background: radial-gradient(ellipse 60% 80% at 70% 50%, rgba(200,255,0,0.04) 0%, transparent 55%);
}
.bg-field::before {
  content:'';
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 119px, rgba(200,255,0,0.02) 120px),
    repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(200,255,0,0.015) 80px);
}
.auth-wrap { position:relative; z-index:1; width:100%; max-width:460px; padding:0 20px; }
.auth-card {
  background:var(--pitch2); border:1px solid var(--rim2);
  border-radius:var(--r-xl); padding:44px 40px;
  box-shadow:0 40px 80px rgba(0,0,0,0.6),var(--lime-glow);
}
.auth-logo { text-align:center; margin-bottom:36px; }
.auth-logo .brand { font-family:var(--font-d); font-size:40px; font-weight:900; color:var(--lime); letter-spacing:3px; display:block; text-shadow:0 0 30px rgba(200,255,0,0.35); }
.auth-logo .tagline { font-family:var(--font-m); font-size:10px; color:var(--chalk4); letter-spacing:2px; margin-top:4px; }
.auth-heading { font-family:var(--font-d); font-size:28px; font-weight:700; color:var(--chalk); margin-bottom:6px; }
.auth-sub { font-size:13px; color:var(--chalk4); margin-bottom:28px; }
.error-box { background:rgba(255,77,109,0.1); border:1px solid rgba(255,77,109,0.3); border-radius:var(--r-sm); padding:12px 16px; font-size:13px; color:var(--loss); margin-bottom:20px; display:none; }
.auth-footer { text-align:center; margin-top:24px; font-size:13px; color:var(--chalk4); }
.auth-footer a { color:var(--lime); text-decoration:none; font-weight:500; }
.back-link { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--chalk4); text-decoration:none; margin-bottom:24px; transition:color var(--transition); }
.back-link:hover { color:var(--chalk3); }
.pw-strength { height:3px; border-radius:2px; margin-top:6px; transition:all 0.3s; }
</style>
</head>
<body>
<div class="bg-field"></div>
<div class="tex"></div>
<div id="toasts"></div>

<div class="auth-wrap">
  <a class="back-link" href="index.html">← Back to home</a>
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand">SOCCKA</span>
      <span class="tagline">EPL Prediction Engine</span>
    </div>
    <div class="auth-heading">Create account</div>
    <div class="auth-sub">Start accessing EPL match predictions today</div>
    <div class="error-box" id="err"></div>
    <div class="input-group">
      <div class="label">Full Name</div>
      <input type="text" id="name" placeholder="John Doe" autocomplete="name"/>
    </div>
    <div class="input-group">
      <div class="label">Email address</div>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="input-group">
      <div class="label">Password</div>
      <input type="password" id="pass" placeholder="Choose a strong password" oninput="checkPW(this.value)"/>
      <div class="pw-strength" id="pw-bar" style="background:var(--rim);width:0%"></div>
    </div>
    <button class="btn btn-lime" style="width:100%;justify-content:center;margin-top:4px" id="reg-btn" onclick="doRegister()">
      Create Account
    </button>
    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
redirectIfLoggedIn();

function checkPW(v) {
  const bar = document.getElementById('pw-bar');
  let score = 0;
  if (v.length >= 8) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['var(--loss)','var(--draw)','var(--lime2)','var(--lime)'];
  const widths  = ['25%','50%','75%','100%'];
  bar.style.background = colors[score-1] || 'var(--rim)';
  bar.style.width = score > 0 ? widths[score-1] : '0%';
}

async function doRegister() {
  const name  = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const errEl = document.getElementById('err');
  const btn   = document.getElementById('reg-btn');
  errEl.style.display = 'none';
  if (!name || !email || !pass) { errEl.textContent='Please fill in all fields.'; errEl.style.display='block'; return; }
  if (pass.length < 6) { errEl.textContent='Password must be at least 6 characters.'; errEl.style.display='block'; return; }
  btn.disabled = true;
  btn.innerHTML = '<div class="spin" style="width:16px;height:16px;border-width:2px"></div> Creating account…';
  try {
    const res = await fetch(API_BASE + '/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ full_name:name, email, password:pass })
    });
    if (!res.ok) {
      const e = await res.json();
      throw new Error(e.detail?.[0]?.msg || e.detail || 'Registration failed');
    }
    const data = await res.json();
    Auth.setToken(data.access_token);
    const ures = await fetch(API_BASE + '/user', { headers: { Authorization:`Bearer ${data.access_token}` } });
    if (ures.ok) Auth.setUser(await ures.json());
    toast('Account created!', 'ok');
    setTimeout(() => window.location.href = 'dashboard.html', 700);
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
